<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Caveat','Comic Sans MS',cursive">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#fbfcfe"/>
  <text x="40" y="52" font-size="34" fill="#1f2937">Bookstore on DynamoDB Local — data paths</text>

  <g filter="url(#wobble)" stroke="#334155" stroke-width="2.5" fill="none">
    <line x1="200" y1="320" x2="230" y2="320" marker-end="url(#arrow)"/>
    <line x1="400" y1="320" x2="430" y2="320" marker-end="url(#arrow)"/>
    <line x1="620" y1="290" x2="655" y2="180" marker-end="url(#arrow)"/>
    <line x1="620" y1="350" x2="655" y2="475" marker-end="url(#arrow)"/>
    <line x1="965" y1="165" x2="1000" y2="300" marker-end="url(#arrow)"/>
    <line x1="965" y1="480" x2="1000" y2="345" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#wobble)" stroke-width="2.5">
    <rect x="40" y="275" width="160" height="90" rx="12" fill="#bfdbfe" stroke="#3b82f6"/>
    <rect x="230" y="275" width="170" height="90" rx="12" fill="#fbcfe8" stroke="#db2777"/>
    <rect x="430" y="255" width="190" height="130" rx="12" fill="#ddd6fe" stroke="#7c3aed"/>
    <rect x="655" y="95" width="310" height="140" rx="12" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="655" y="420" width="310" height="130" rx="12" fill="#fde68a" stroke="#d97706"/>
    <rect x="1000" y="270" width="150" height="105" rx="12" fill="#fecaca" stroke="#dc2626"/>
  </g>

  <g fill="#1f2937">
    <text x="120" y="315" font-size="22" text-anchor="middle">Client</text>
    <text x="120" y="342" font-size="17" text-anchor="middle" fill="#475569">curl / Swagger</text>

    <text x="315" y="315" font-size="22" text-anchor="middle">JWT Auth Filter</text>
    <text x="315" y="342" font-size="16" text-anchor="middle" fill="#475569">HS256 Bearer</text>

    <text x="525" y="300" font-size="22" text-anchor="middle">Spring Boot 4.1</text>
    <text x="525" y="326" font-size="16" text-anchor="middle" fill="#475569">Controllers</text>
    <text x="525" y="348" font-size="16" text-anchor="middle" fill="#475569">Services</text>

    <text x="810" y="130" font-size="21" text-anchor="middle">Reads + SQL console</text>
    <text x="810" y="158" font-size="16" text-anchor="middle" fill="#475569">JdbcTemplate (explicit SQL)</text>
    <text x="810" y="180" font-size="16" text-anchor="middle" fill="#475569">HikariCP pool</text>
    <text x="810" y="205" font-size="16" text-anchor="middle" fill="#475569">DynamoDB JDBC driver</text>

    <text x="810" y="455" font-size="21" text-anchor="middle">All writes (transactions)</text>
    <text x="810" y="483" font-size="16" text-anchor="middle" fill="#475569">AWS SDK v2 DynamoDbClient</text>
    <text x="810" y="508" font-size="16" text-anchor="middle" fill="#475569">ExecuteTransaction</text>

    <text x="1075" y="315" font-size="20" text-anchor="middle">DynamoDB</text>
    <text x="1075" y="340" font-size="18" text-anchor="middle" fill="#475569">Local :8000</text>
  </g>

  <g fill="#475569" font-size="16">
    <text x="600" y="205" text-anchor="middle">PartiQL</text>
    <text x="600" y="223" text-anchor="middle">ExecuteStatement</text>
    <text x="600" y="450" text-anchor="middle">native</text>
    <text x="600" y="468" text-anchor="middle">transaction</text>
    <text x="1005" y="225" text-anchor="middle">PartiQL</text>
    <text x="1000" y="435" text-anchor="middle">ACID (all-or-nothing)</text>
  </g>
</svg>
